# Surface Pro 11 árfigyelő – Synology Container Manager projekt.
# Ugyanaz a minta, mint a hbd-inventory-watcher: kész python image, induláskor letölti a
# programot a GitHub-ról, telepíti a függőségeket, majd a napi ütemezőt futtatja.
#
# Container Manager → Projekt → Létrehozás → név: surface-price-watch,
# útvonal: /volume1/docker/surface-price-watch (benne ez a compose.yaml és egy üres data mappa).
# Az SMTP_PASSWORD értékét kézzel kell beírni.
services:
  surface-price-watch:
    image: python:3.12-slim-bookworm
    container_name: surface-price-watch

    restart: unless-stopped

    environment:
      SMTP_PASSWORD: "IDE_IRD_BE_A_TECHNIKAI_FIOK_JELSZAVAT"
      SMTP_HOST: "mail.home.arpa"
      SMTP_PORT: "587"
      SMTP_SECURITY: "starttls"
      SMTP_USER: "technikai"
      SMTP_VERIFY_TLS: "false"
      MAIL_FROM: "technikai@mail.home.arpa"
      MAIL_FROM_NAME: "Surface árfigyelő"
      MAIL_TO: "technikai@mail.home.arpa"
      TZ: "Europe/Budapest"
      # napi futás ideje (helyi idő)
      RUN_AT: "07:00"
      # "true" = a konténer indulásakor azonnal fusson egyszer (első próbához)
      RUN_ON_START: "false"
      # "true" = ha a konténer a RUN_AT után indul és aznap még nem volt levél, pótolja
      CATCH_UP: "true"
      PRICEWATCH_CONFIG: "/app/config/config.yaml"
      PRICEWATCH_DATA: "/data"

    extra_hosts:
      - "mail.home.arpa:192.168.1.168"

    volumes:
      - ./data:/data   # SQLite ártörténet, napló, utolsó jelentés (a projektmappa data almappája)

    command:
      - /bin/sh
      - -lc
      - |
        set -eu

        echo "Surface árfigyelő inicializálása..."

        mkdir -p /data

        python - <<'PY'
        import io
        import shutil
        import tarfile
        from pathlib import Path
        from urllib.request import urlopen

        URL = "https://github.com/takachlaszlo/surface-price-watch/archive/refs/heads/main.tar.gz"
        data = urlopen(URL, timeout=120).read()
        tmp = Path("/tmp/src")
        shutil.rmtree(tmp, ignore_errors=True)
        with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tar:
            tar.extractall(tmp)
        shutil.rmtree("/app", ignore_errors=True)
        shutil.copytree(next(tmp.iterdir()), "/app")
        PY

        pip install --no-cache-dir -r /app/requirements.txt tzdata

        echo "Inicializálás kész."
        echo

        cd /app
        exec python -u -m pricewatch daemon
